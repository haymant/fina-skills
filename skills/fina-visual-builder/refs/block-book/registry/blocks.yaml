    note: >-
      NO STANDALONE KERNEL, AND THE EARLIER COUNT OF "TWICE" WAS WRONG - it counted
      engine.cpp alone. Nineteen sites across six lanes. Within engine.cpp the two
      copies at :235 and :283 are NOT equivalent: :235 also sets the memory
      latches, :283 does not, so the same expression has two different side
      effects 48 lines apart. Two of the nineteen (fina_risk_cpp.cpp:776-777)
      compute a barrier-scaled up/down worst, which is a different quantity
      entirely. daily_termsheet.py:258-259 hardcodes the basket to two assets and
      accepts three, so a 3-asset deal is silently priced on two. Extracting the
      block is a prerequisite for testing it.
    two_names_is_OUR_limit_not_the_products: >-
      CORRECTION OF FRAMING. An earlier note recorded this as "the whole lane is
      two-name by construction", which implies the product cannot do better. It
      can. The MurexPlaybook states the platform limit explicitly: "Basket Size:
      maximum of 6 underlying stocks" (RakiPlus_MemRakiPlus.md:121,
      payoff/raki-plus.md:217), and the "Single Equity: not supported" line means
      two is the MINIMUM. So the stage 1 refusal is right, and the platform path
      already exists -- KIKOSELECT carries an array of underlyings and
      per-underlying reference prices, and `engine.cpp:250` loops over
      `cube.underlyings` at any width. It is an implementation gap of at most two
      lines, not a product change.
    the_indicator_is_now_defined: >-
      The playbook leaves the aggregation convention undefined on purpose --
      "The source labels the accrual indicator as either Worst Performance or All
      Underlying, but does not define a mathematical aggregation convention for
      either" (payoff/raki-plus.md:34). The TERM SHEET resolves it:
      "Worst Performing Reference Asset ... the Reference Asset which generates
      the lowest percentage", computed as
      `(Closing Price of the relevant Reference Asset on the relevant Scheduled
      Trading Day) / (Initial Spot Price of the relevant Reference Asset) x 100%`,
      "rounded to four decimal places, with 0.00005 or above rounded upwards"
      (termsheet1.md:275-276). So the indicator is
      `min_i(close_i / initial_i)`, and the 4dp rule is a documented term-sheet
      rule that no lane implements. The 4dp is immaterial except for exact ties,
      and the tie-break is "in our sole and absolute discretion" -- explicitly
      NOT modelable. Record it as a known-unimplementable term rather than a
      missing one.
    latched_assets_stay_in_the_basket: >-
      A term-sheet rule that rules out a tempting optimisation, and is currently
      satisfied by accident: "if a Reference Asset becomes a Memorised Reference
      Asset, such Reference Asset REMAINS as part of the Reference Basket for the
      purposes of determining whether a Knock-in Event has occurred and for the
      purposes of determining the Final Settlement Payout" (termsheet1.md:279).
      No lane drops a latched asset, and the graph edge
      `worst_of_performance -> knock_in_gate` is therefore correct. A future
      optimisation that excludes called assets would break the contract.
    maturbarrier_ge_kibarrier_is_load_bearing: >-
      A DERIVED invariant, documented nowhere. The KI payoff has two branches,
      selected on `WPS >= MaturBarrier` (payoff/raki-plus.md:139-140, and the
      product form at RakiPlus_MemRakiPlus.md:38,55). This deal sets
      `MaturBarrier = 0.78` and `KIBarrier = 0.7`; a knocked-in deal has
      WPS <= 0.70 < 0.78, so the KI1 branch is UNREACHABLE -- which is the only
      reason it is safe that `strikeKI1 = 0`. If a booking ever set
      `MaturBarrier` below the KI barrier, the deal would reach
      `PR_KI1 * (WPS / Strike_KI1 - 1)` with `Strike_KI1 = 0` and divide by zero.
      Assert the invariant; do not rely on it.

