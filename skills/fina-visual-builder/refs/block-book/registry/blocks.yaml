      correct six-line tie-break between two booleans; it answers "which of two
      fired", not "did a barrier fire". Five lanes inline the block itself and no
      two agreed before stage 1. One (fina_risk_cpp.cpp) is now split: one site
      conformant, two still not, in the same translation unit. See
      `same_fixing_verdict`.
    same_fixing_verdict:
      was: >-
        Recorded as "the one deliberate, documented departure in the whole
        repository -- a real, defensible, disclosed reserving decision that
        should be preserved and labelled, not fixed", and stage 1 left it alone
        on that basis. THE PREMISE WAS WRONG and the label has been withdrawn.
      finding: >-
        `fina_risk_cpp.cpp` tests all assets at/above the 110% call barrier on
        the SAME fixing and explicitly refuses to credit a pre-latched asset.
        The term sheet says the opposite, in the plainest possible words:
        "a Reference Asset will BECOME a Memorised Reference Asset when a Memory
        US Stocks Event ... has OCCURRED" and termination needs "EACH" asset to
        have become one. A past, persistent status, not a same-day test.
        The MurexPlaybook forbids the C++ reading in as many words:
        "Never overwrite a prior memory-hit or KI state with a later non-hit
        unless product semantics explicitly provide for reset, which the source
        does not" (payoff/raki-plus.md:213); "Update ki_seen MONOTONICALLY"
        (Products/KIKO/payoff/reverse-kiko.md:59); and the latch semantics are
        "occurs at
        least once for all underlyings" (eight files).
        The playbook does flag simultaneity as an open question
        (payoff/raki-plus.md:224) -- and then answers it in the same document,
        at :213, in the direction above.
      the_comment_is_backwards: >-
        The source reads "that only makes the call easier and would lower the
        reserve". It is not conservative -- it is the more expensive side.
        MISSING a call leaves the note alive, so the coupon leg keeps running
        and the terminal branch is never taken. Both are more liability, not
        less. The comment's premise is inverted.
      materiality_on_this_deal: >-
        ADBE latched on 2026-06-01 (`GKODate[0] = 46174`), so from then on only
        AMZN crossing 286.00 stands between the note and termination. The C++
        lane additionally requires ADBE to be back ABOVE 263.967 on that same
        day. The two readings differ on every path after 2026-06-01.
      correct_implementation: >-
        `pricing.py:304-321` is the conformant one -- per-asset, sticky, OR'd
        into a path-level copy, seeded from `GKOLocked`, with
        `is_called = path_locked.all(axis=1) & (call_date == steps)`.
      action: >-
        TAKEN AT STAGE 1, one site of three. `price_fixture` now reads
        `KIKOSelect.GKOLocked` (`:464-493`) into a per-asset seed and applies a
        sticky in-path latch (`:560-572`); the joint test and the comment
        defending it are gone. Test `lane/global_ko_latch`, seven hand-derived
        cases in `cpp/tests/global_ko_latch_test.cpp`. Reverting the fix fails
        cases A, D and F; reverting only the seed fails A and F, so the two
        halves are separately pinned.
        Materiality on `termsheet1`: NONE, and for a stronger reason than the
        test supplies. `termsheet1` is not priced through `price_fixture`; it
        goes through `price_daily_compact`, which stage 1 did not touch. So the
        fix cannot move that PV. Case B is still worth having, because it
        reproduces the SHAPE of `termsheet1`'s `GKOLocked = [true, false]` in
        this lane and pins that one latch out of two is not a call — which is
        the guard against a fix that fires on a single latch and would make
        every note in the book callable.
        `run_cpp_parity:884-895` and `price_daily_compact:1084-1090` remain
        OPEN; see `open_sites` below.
    open_sites:
      summary: >-
        TWO OF THE THREE global-KO SITES IN `fina_risk_cpp.cpp` ARE STILL
        NON-CONFORMANT, IN THE SAME FILE AS THE ONE THAT WAS FIXED. This is
        recorded rather than fixed, and the reason it is not a local change is
        the finding.
      sites:
        - {function: run_cpp_parity, lines: "884-895", status: open, severity: medium}
        - {function: price_daily_compact, lines: "1084-1090", status: open,
           severity: high, note: "the lane termsheet1 is actually priced through"}
      why_not_fixed_now: >-
        Both take the block from a COMPACT instrument record, not from the deal.
        `price_daily_compact` reads `refs`, `strike`, `ki`, `call`, `expiry`,
        `notional` and `quote_scale` off a json object, and that object has no
        field for the latch: `gko_locked` is not read and the key is not in the
        schema. The record schema is owned by whoever writes the records --
        `scripts/generate_benchmark.py` and the ETL -- not by this file. So the
        change is a record-schema change with a different owner and a different
        risk profile, and it is a contract change rather than a bug fix.
      why_not_just_add_the_read: >-
        Reading `inst.value("gko_locked", ...)` in `price_daily_compact` would be
        four lines, would compile, and would be INERT on every real deal,
        because no producer ever sets the key. It would also make the diff say
        "fixed". A change that is inert in production and legible in review is
        worse than no change, so the two sites are left visibly non-conformant
        with their line numbers here.
      the_actual_consequence: >-
        The C++ lane now contains BOTH readings of the contract, in one
        translation unit, on the same deal geometry: a conformant sticky
        per-asset latch in `price_fixture`, and the joint same-fixing test in
        `run_cpp_parity` and `price_daily_compact`. There is no longer a single
        site in this file to go and look at when two lanes disagree.
      next_step: >-
        Add `gko_locked` to the compact instrument record in
        `generate_benchmark.py` and the ETL, then read it in
        `price_daily_compact` and `run_cpp_parity` and extend
        `cpp/tests/global_ko_latch_test.cpp` to price the daily lane as well.
        Deliberately not done in the same pass as the `price_fixture` fix, so
        that the two halves stay separately testable.
      a_second_smaller_gap: >-
        NEITHER LANE CHECKS THE LATCH DATE. `KIKOSelect.GKODate` dates each
        latch and a latch dated after the evaluation date has not happened yet,
        so crediting it would call a note that is not callable. `pricing.py`
        seeds straight from `GKOLocked` and so does the new C++ read: one rule
        in both lanes so they stay comparable. The gap is real, it is recorded
        rather than half-fixed in one lane, and the test cases all use dates at
        or before the evaluation date (or zero) so the gap cannot mask a
        regression in the flag handling itself.
    same_day_precedence: >-
      A specification sentence the lanes do not implement and the registry did
      not record: "If both a Local and Global KO are triggered on the same day,
      the event is treated as a Global KO" -- Memory_Range_Accrual_MemRaki.md:18,
      RAKI_Enhancement.md:48, Products/KIKO/Reverse_KIKO.md:30, and formally
      as tau_G <= tau_L -> GKO in Products/KIKO/payoff/reverse-kiko.md:65.
      payoff/raki-plus.md:30 claims the source does not say this; that claim is
      contradicted by three sibling documents in the same playbook. Inert on
      this deal (`localKO: false`) but it is a spec sentence.

