    book_page: null
    note: >-
      The SAME kernel as cash_settlement. settlement_for returns a descriptor
      carrying both the settlement kind and a physical_delivery flag; the two
      are not a runtime branch. A registry entry that presents them as mutually
      exclusive blocks would generate two tests of one function.
    quantity_formula_now_available: >-
      The playbook admits it cannot supply this: "The document supplies no
      mapping from the maturity residual formula to an in-the-money test and no
      physical-delivery quantity formula" (Products/KIKO/payoff/reverse-kiko.md).
      The TERM
      SHEET supplies both, so this block is no longer blocked on product
      knowledge. "The Physical Settlement Amount ... In respect of every Nominal
      Amount of Memory US Stocks ELIs, a number of the Worst Performing Reference
      Asset as at the Final Fixing Date calculated as follows:
      (Nominal Amount) / (Exercise Price of the Worst Performing Reference Asset
      as at the Final Fixing Date)" (termsheet1.md:318-322), calculated per ELI.
      Odd lots are DELIVERED and fractional shares are NOT rounded as shares --
      "Any odd lot(s) ... will be delivered to you as part of the Physical
      Settlement Amount. Any fractional stocks, which will not be rounded ... will be
      settled by payment of a cash amount" (line 328). It is the CASH AMOUNT that is
      rounded, to 0.01 with 0.005 upwards, and "No Cash Settlement Expenses will be
      payable for the cash payment of any Fractional Stocks" -- same line. The
      general Cash Settlement Expenses row adds that such charges are "Currently
      there are no such charges or expenses" at all (line 347).
      "as at the Final Fixing Date" attaches to WHICH ASSET is worst, not to a
      re-struck exercise price -- the Exercise Price is fixed in the Price Table
      at 78% of initial spot, 187.1766 for ADBE and 202.8000 for AMZN.
      Sanity check against the Murex rate form
      `PR_KI2 * (WPS/Strike_KI2 - 1)` with `PR_KI2 = -1`, `Strike_KI2 = 0.78`:
      value / notional = WPS / 0.78, so the change from par is WPS/0.78 - 1, and
      PR = -1 flips the sign. They are the same economics in a rate form and a
      quantity form. This is the last excuse for not implementing delivery.
    leg_naming_is_non_conformant: >-
      Separate finding, on the RESULT rather than the block. The payload reports
      this leg as `legName: "PUT"`, `legId: 1`, `multiplier: -1`, and the engine
      echoes "PUT". The playbook forbids exactly that label: "The terminal leg
      must not be labelled a standalone vanilla put unless the product contract
      proves that interpretation" (raki-plus-native-engine-methodology.md). The
      contract does not prove it -- this is an ELI settled by physical delivery
      of the worst performer at 78% moneyness behind a 70% knock-in, and a traced
      run must be able to say why the note terminated. The right shape already
      exists in this repository: `intrinsic_option` with
      `basket: worst_of`, `knockIn`, `physical_delivery` in the benchmark
      fixtures.

