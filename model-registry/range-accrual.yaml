registry: fina/model-wiring
version: 1
product_family: range-accrual
aliases:
  - RAKI
  - MemRaki
  - RakiPlus
status: design
flex:
  header: EqFlexRaki
  payoff_script: EqFlexRaki
  model_group: EQ_RAKI
  blocks:
    - name: KIKOSELECT
      aliases: [KIKOSTRUCT, KIKOSEL*]
      purpose: Basket definition, feature toggles (LKO/GKO/KI), return ratio, initial fixing, denomination, and quanto FX fields.
      terms_path: /features
      fields: [underlying, referencePrice, localKO, globalKO, knockIn, returnRatio, denomination]
    - name: RGACCDATE
      aliases: [FIXINGDATE]
      purpose: Daily observation / fixing date generation for range accrual and barrier monitoring.
      terms_path: /schedule
      fields: [obvDate, accrual, fixingDone]
    - name: RGACCLKO
      aliases: [RGACCLKO+, RGACCPERIO, PERIODS]
      purpose: Period schedules, accrual rate, range bounds and compare operators, local barriers, KO coupons, and accrual indicator.
      terms_path: /economics
      fields: [accIndicator, accruRate, lowRange, upRange, locBarPrice, locKOCpn, gblKOCpn, N1, N2]
    - name: GLOBALKO*
      aliases: [GLOBALKO, DAILYKO]
      purpose: Global/daily KO observation schedule and payment timing (Period End vs KO Date).
      terms_path: /economics
      fields: [choice, effectiveSche, shifter, obvDate, effectiveDate]
    - name: KNOCKIN*
      aliases: [KNOCKIN]
      purpose: KI barrier and maturity payoff parameters (cap, floor, participation, strike, rebate).
      terms_path: /economics
      fields: [choice, KIBarrier, capUp, floorUp, PRUp, strikeKI1, rebate]
terms:
  schema: ProductTerms
  version: pending-freeze
  feature_families:
    - range_accrual
    - local_ko
    - global_ko
    - memory_coupon
    - memory_ko
    - final_fixing_ki
pricing_request:
  schema: pricing-request.schema.json
  version: pending-product-projection
lifecycle:
  state_schema: pending-freeze
  events:
    - trade.lifecycle.registered
    - trade.lifecycle.fixed
    - trade.lifecycle.knocked
    - trade.lifecycle.coupon_determined
    - trade.lifecycle.expired
market_data:
  required:
    - equity_spot
    - equity_vol_surface
    - dividend_curve
    - discount_curve
    - equity_equity_correlation
    - fixing_calendar
  calendar: product-specific
  observation_style: daily-or-periodic
  fixing_source: pending
pricing:
  logical_handler: fina-pricer.pricing_and_sensitivity
  backends:
    reference:
      kind: python_reference
      repository: fina-risk
      callable: pending-range-accrual-oracle
      allowed_for: conformance-only
    native:
      kind: native_cpp
      repository: fina-risk
      callable: pending-daily-range-accrual-entrypoint
      engine_marker: pending
      required_for: production-evidence
      allowed_for: production-evidence
      fallback_allowed: false
risk_profiles:
  quote:
    measures: [PV]
    method: pending
  full-trading:
    measures: [PV, EQ_DELTA, EQ_GAMMA, EQ_VEGA, RHO, CORRELATION, DIVIDEND]
    method: declared-per-measure
    status: pending
constraints:
  - define inclusive-exclusive range operators
  - define memory coupon and global KO compatibility
  - define fixing and payment calendar
  - define KO coupon and return-ratio timing
evidence:
  status: pending
  required_checks:
    - product_terms_conformance
    - boundary_operator_fixtures
    - memory_state_replay
    - native_reference_parity
    - fixing_to_cashflow_e2e
