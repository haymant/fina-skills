registry: fina/model-wiring
version: 1
product_family: fcn
aliases:
  - ELI
  - FCN
  - ELIFCN_KI
status: executable
flex:
  header: ELIFCN_KI
  payoff_script: ELIFCN_KI
  model_group: memraki
  blocks:
    - name: KIKOSelect
      aliases: [KIKOSELECT, KIKOSEL*]
      purpose: Main selection block. Feature toggles (LKO/GKO/KI), return ratio, initial fixing date, basket constituents and reference prices, denomination, and settlement flags.
      terms_path: /features
      fields:
        - productType
        - notionalReturn
        - returnRatio
        - knockIn
        - initialFixDate
        - denomination
        - underlying
        - referencePrice
        - underlyingCcy
        - FXPair
        - FXFixSource
        - localKO
        - globalKO
        - knockInType
        - ITMPayment
    - name: RGACCDate
      aliases: [RGACCDATE, FIXINGDATE]
      purpose: Observation, accrual, and fixing date generation.
      terms_path: /schedule
      fields: [obvDate, accrual, fixingDone]
    - name: RGACCLKO
      aliases: [RGACCLKO, RGACCPERIO, PERIODS]
      purpose: Per-period accrual, range bounds, local barriers, and KO coupons; carries the accrual indicator and N1/N2 counts.
      terms_path: /economics
      fields: [accIndicator, startDate, endDate, paymentDate, localKO, locBarPrice, locKOCpn, gblKOCpn, gblBarPrice, accruRate, lowRange, upRange, fixCoupon, N1, N2]
    - name: globalKOStar
      aliases: [GLOBALKO*, DAILYKO]
      purpose: Global/daily KO observation schedule and payment timing (Period End vs KO Date).
      terms_path: /features
      fields: [effectiveSche, IREffectiveSche, IREffectiveDate, shifter, obvDate, effectiveDate, globalKO]
    - name: knockInStar
      aliases: [KNOCKIN*]
      purpose: KI barrier and maturity payoff parameters (cap, floor, participation, strike, rebate) for the KI and no-KI branches.
      terms_path: /economics
      fields: [choice, KIBarrier, strikeKI2, maturBarrier, capUp, capUpVal, floorUp, floorUpVal, PRUp, strikeUp, obvDate, paymentDate, knockIn]
terms:
  schema: fcn-terms-projection.schema.json
  version: pending-freeze
  source_schema: fcn-legacy-termsheet.schema.json
  source_fixture: schema/examples/fcn/source/termsheet1.fcn.sample.json
  projection_fixture: schema/examples/fcn/terms/fcn-terms-projection.example.json
  feature_coverage:
    observation_style:
      - discrete
      - continuous
    performance_indicator:
      - worst_of
      - best_of
      - average
      - kth_best
    barrier_scope:
      - global
      - local
    barrier_roles:
      - knock_in
      - knock_out
      - kiko
    knock_out:
      ko_type: [american, european]
      operators: [">", ">="]
      rebate_payment_type: [at_knock, at_maturity]
      return_ratio: documented
      ko_coupon: documented
    memory:
      memory_coupon: engine_evidenced
      memory_ko: terms_and_ui_supported_engine_pending
    accrual_indicator: [all, any]
payoff_graph:
  schema: payoff-graph.schema.json
  version: fina/payoff-graph/v1
  fixture: schema/examples/fcn/pricing/payoff-graph.example.json
  emitter: modules/fina-core/python/fina_core/payoff.py::compile_payoff_graph
  lowerings:
    fcn_terms: modules/fina-core/python/fina_core/payoff.py::lower_payoff_graph_to_fcn_terms
    pricing_request: modules/fina-core/python/fina_core/payoff.py::lower_payoff_graph_to_pricing_request
    enriched_request: modules/fina-core/python/fina_core/payoff.py::enrich_pricing_request
  kernel_bindings: "function_bindings (fina_risk_cpp modules: schedule.hpp, terminal_option.hpp, coupon.hpp, barriers.hpp, funding.hpp, settlement.hpp, engine.hpp)"
pricing_request:
  schema: pricing-request.schema.json
  version: reviewed-v1
  fixture: schema/examples/fcn/pricing/pricing-request.example.json
  result_schema: fcn-native-pricing-result.schema.json
  quote_fixture: schema/examples/fcn/pricing/native-quote-result.example.json
  reprice_fixture: schema/examples/fcn/pricing/native-reprice-result.example.json
lifecycle:
  state_schema: fcn-lifecycle-state.schema.json
  event_schema: fcn-lifecycle-event.schema.json
  transition_schema: fcn-lifecycle-transition.schema.json
  fixing_record_schema: fcn-fixing-record.schema.json
  market_operation_schema: fcn-market-operation.schema.json
  events:
    - trade.lifecycle.registered
    - trade.lifecycle.amended
    - trade.lifecycle.fixed
    - trade.lifecycle.knocked
    - trade.lifecycle.expired
    - trade.lifecycle.exercised
market_data:
  required:
    - equity_spot
    - equity_vol_surface
    - dividend_curve
    - discount_curve
    - equity_equity_correlation
    - fixing_calendar
  calendar: NYSE
  observation_style: daily
  fixing_source: generated_shared_path_cube
pricing:
  logical_handler: fina-pricer.pricing_and_sensitivity
  backends:
    reference:
      kind: python_reference
      repository: fina-risk
      module: fina_risk.daily_termsheet
      callable: price_daily_termsheet
      source_revision: 61351d4
      allowed_for: oracle-conformance
    native:
      kind: native_cpp
      repository: fina-risk
      source_revision: 61351d4
      module: fina_risk_cpp
      callable: run_daily_termsheet
      build_target: fina_risk_cpp
      engine_marker: cpp_daily_termsheet_eki
      required_for: production-evidence
      allowed_for: production-evidence
      fallback_allowed: false
  path_count: 30000
  seed: 1729
  bump: 0.01
  state_features:
    - final_fixing_eki
    - global_ko
    - range_fixing_counts
    - unpaid_fixing_memory
    - payment_date_discounting
risk_profiles:
  quote:
    measures: [PV]
    method: native_cpp_daily_termsheet
  eq-delta:
    measures: [PV, EQ_DELTA]
    method: central_bump_revalue
    bump: 0.01
    convention: relative_spot
  full-trading:
    measures: [PV, EQ_DELTA, EQ_GAMMA, EQ_VEGA, RHO, CORRELATION]
    method: declared-per-measure
    status: pending-complete-risk-profile
evidence:
  status: verified
  required_engine_marker: cpp_daily_termsheet_eki
  parity_reference: fina-risk/benchmark/daily-termsheet-parity.md
  e2e_command: python schema/examples/fcn/run_fcn_mcp_e2e.py --termsheet schema/examples/fcn/source/termsheet1.fcn.sample.json --count 1 --paths 128 --seed 42 --artifacts-dir schema/examples/fcn/pricing
  checks:
    - process_schema_valid
    - lifecycle_contracts_valid
    - two_etl_calls
    - native_quote
    - native_reprice
    - amended_trade_persisted
    - amendment_event_delivered
    - olap_derived_from_reprice
  tolerances:
    pv_absolute: 1.0e-10
    greek_absolute: 1.0e-8
